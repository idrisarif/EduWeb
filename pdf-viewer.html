<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penampil Materi PDF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3YWh3ZXJoeGtxcG5oeGxsYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcxODQ4OTUsImV4cCI6MjA2Mjc2MDg5NX0.8-HqAo5AEK5nPU86mTAme8SQv-egMYPDy39wJ-3bEwg';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function getMateriById(materiId) {
            const { data: materi, error } = await supabase
                .from('materi')
                .select(`
                    id_materi,
                    judul,
                    deskripsi,
                    file_url,
                    user (
                        nama
                    )
                `)
                .eq('id_materi', materiId)
                .single();

            if (error || !materi) {
                console.error('Error fetching materi:', error);
                document.querySelector('.box-container').innerHTML = '<p class="empty">Materi tidak ditemukan.</p>';
                return;
            }

            renderMateri(materi);
        }

        function renderMateri(materi) {
            const container = document.querySelector('.box-container');
            container.innerHTML = '';
            
            const box = document.createElement('div');
            box.classList.add('box');

            const title = document.createElement('h3');
            title.classList.add('title');
            title.textContent = materi.judul;
            
            const tutorName = document.createElement('p');
            tutorName.classList.add('tutor-name');
            tutorName.textContent = `Oleh: ${materi.user?.nama || 'Pengguna Tidak Dikenal'}`;
            
            const description = document.createElement('p');
            description.classList.add('description');
            description.textContent = materi.deskripsi;
            
            const pdfViewerContainer = document.createElement('div');
            pdfViewerContainer.classList.add('pdf-viewer-container');
            
            const iframe = document.createElement('iframe');
            iframe.src = materi.file_url;
            iframe.title = materi.judul;
            pdfViewerContainer.appendChild(iframe);

            box.appendChild(title);
            box.appendChild(tutorName);
            box.appendChild(description);
            box.appendChild(pdfViewerContainer);

            container.appendChild(box);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                console.log('Login OK:', session.user.email);
                const params = new URLSearchParams(window.location.search);
                const materiId = params.get('materiId');
                
                if (materiId) {
                    getMateriById(materiId);
                } else {
                    document.querySelector('.box-container').innerHTML = '<p class="empty">Tidak ada materi yang dipilih. Kembali ke halaman daftar.</p>';
                }
            } else {
                supabase.auth.onAuthStateChange((event, session) => {
                    if (!session) {
                        window.location.href = 'login.html';
                    }
                });
            }
        });

        // ... (Kode untuk logout dan nama pengguna tidak diubah)

    </script>
</head>
<body>

    <header class="header">
        <section class="flex">
            <a href="home.html" class="logo">EduWeb</a>
            <div class="icons">

                <div id="user-btn" class="fas fa-user"></div>
                <div id="toggle-btn" class="fas fa-sun"></div>
            </div>
            <div class="profile">
                <p class="role">Halo</p>
                <h3 class="name" id="userName"></h3>
                <a id="logoutBtn" class="delete-btn">Keluar</a>
            </div>
        </section>
    </header>

    <div class="side-bar">
        <div id="close-btn">
            <i class="fas fa-times"></i>
        </div>
        <div class="profile">
            <img src="images/pic-1.jpg" class="image" alt="">
            <h3 class="role">Eduweb</h3>
            <h2 class="name">Daftar Menu</h2>
        </div>
        <nav class="navbar">
            <a href="home.html"><i class="fas fa-home"></i><span>Beranda</span></a>
            <a href="courses.html"><i class="fas fa-book"></i><span>Materi</span></a>
            <a href="playlist.html"><i class="fas fa-play-circle"></i><span>Video</span></a>
            <a href="courses2.html"><i class="fas fa-edit"></i><span>Tugas</span></a>
        </nav>
    </div>

    <section class="courses">
        <h1 class="heading">Materi Terpilih</h1>
        <div class="box-container">
            </div>

    <script src="js/script.js"></script>

</body>
</html>
