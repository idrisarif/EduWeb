<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Materi</title>
    <link rel="icon" type="image/x-icon" href="images/pic-1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'

        const supabaseUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3YWh3ZXJoeGtxcG5oeGxsYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcxODQ4OTUsImV4cCI6MjA2Mjc2MDg5NX0.8-HqAo5AEK5nPU86mTAme8SQv-egMYPDy39wJ-3bEwg'
        const supabase = createClient(supabaseUrl, supabaseKey)

        let editingMateriId = null;
        let currentFileUrl = null;
        let currentThumbnailUrl = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession()
            if (session) {
                console.log('Login OK:', session.user.email)
                document.getElementById('userName').innerText = localStorage.getItem('nama') || 'Pengguna'
                loadAllVideo()
            } else {
                window.location.href = 'login.html'
            }
        })

        async function loadAllMateri() {
            const { data, error } = await supabase
                .from('materi')
                .select(`
                    id_materi,
                    judul,
                    deskripsi,
                    file_url,
                    thumbnail_url,
                    created_by,
                    user:created_by (nama)
                `);

            if (error) {
                console.error('Gagal mengambil data:', error);
                return;
            }

            const tableBody = document.getElementById('materiTableBody');
            tableBody.innerHTML = '';

            data.forEach(materi => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td data-label="Judul:">${materi.judul}</td>
                    <td data-label="Deskripsi:">${materi.deskripsi}</td>
                    <td data-label="File:"><a href="${materi.file_url}" target="_blank">Lihat File</a></td>
                    <td data-label="Thumbnail:"><img src="${materi.thumbnail_url || 'https://via.placeholder.com/50'}" alt="Thumbnail" width="50"></td>
                    <td data-label="Dibuat oleh:">${materi.user?.nama || 'Tidak diketahui'}</td>
                    <td data-label="Aksi:">
                        <button onclick="editMateri('${materi.id_materi}', '${materi.created_by}')">Edit</button>
                        <button onclick="deleteMateri('${materi.id_materi}', '${materi.created_by}')">Hapus</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        loadAllMateri();

        window.deleteMateri = async function(id, creatorId) {
            const { data: { user } } = await supabase.auth.getUser();
            if (user.id !== creatorId) {
                alert("Anda tidak dapat menghapus Materi Guru lainnya.");
                return;
            }

            if (!confirm('Apakah Anda yakin ingin menghapus materi ini?')) {
                return;
            }
            
            const { data: materi, error: fetchError } = await supabase
                .from('materi')
                .select('file_url, thumbnail_url')
                .eq('id_materi', id)
                .single();

            if (fetchError) {
                alert('Gagal mengambil data materi: ' + fetchError.message);
                return;
            }

            const baseMateriUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co/storage/v1/object/public/materi/';
            const baseGambarUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co/storage/v1/object/public/gambar/';

            if (materi.file_url) {
                const { error } = await supabase.storage
                    .from('materi')
                    .remove([materi.file_url.replace(baseMateriUrl, '')]);
                if (error) console.error('Gagal menghapus file materi:', error);
            }

            if (materi.thumbnail_url) {
                const { error } = await supabase.storage
                    .from('gambar')
                    .remove([materi.thumbnail_url.replace(baseGambarUrl, '')]);
                if (error) console.error('Gagal menghapus thumbnail:', error);
            }

            const { error: deleteMateriError } = await supabase
                .from('materi')
                .delete()
                .eq('id_materi', id);

            if (deleteMateriError) {
                alert('Gagal menghapus data materi: ' + deleteMateriError.message);
                return;
            }

            alert('Materi berhasil dihapus!');
            await loadAllMateri();
        };

        const modal = document.getElementById("materiModal");
        const btn = document.getElementById("openModalBtn");
        const span = document.querySelector(".close");
        const materiForm = document.getElementById('materiForm');

        window.editMateri = async function(id, creatorId) {
            const { data: { user } } = await supabase.auth.getUser();
            if (user.id !== creatorId) {
                alert("Anda tidak dapat mengedit Materi Guru lainnya.");
                return;
            }

            const { data, error } = await supabase
                .from('materi')
                .select('*')
                .eq('id_materi', id)
                .single();

            if (error) {
                alert('Gagal mengambil data materi: ' + error.message);
                return;
            }
            
            document.querySelector('#materiForm [name="judul"]').value = data.judul;
            document.querySelector('#materiForm [name="deskripsi"]').value = data.deskripsi;
            
            currentFileUrl = data.file_url;
            currentThumbnailUrl = data.thumbnail_url;
            editingMateriId = id;
            
            document.getElementById("materiModalTitle").innerText = "Edit Materi";
            modal.style.display = "block";

            document.getElementById('fileInput').required = false;
            document.getElementById('fileInput').closest('.form-group').style.display = 'block';
            document.getElementById('thumbnailInput').required = false;
            document.getElementById('thumbnailInput').closest('.form-group').style.display = 'block';
            
            document.getElementById('fileInput').value = '';
            document.getElementById('thumbnailInput').value = '';
        };
        
        btn.onclick = function() {
            modal.style.display = "block";
            document.getElementById("materiModalTitle").innerText = "Tambah Materi";
            editingMateriId = null;
            currentFileUrl = null;
            currentThumbnailUrl = null;
            materiForm.reset();
            
            document.getElementById('fileInput').required = true;
            document.getElementById('fileInput').closest('.form-group').style.display = 'block';
            document.getElementById('fileInput').value = '';

            document.getElementById('thumbnailInput').required = true;
            document.getElementById('thumbnailInput').closest('.form-group').style.display = 'block';
            document.getElementById('thumbnailInput').value = '';
        };
        
        span.onclick = function() {
            modal.style.display = "none";
        };

        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };

        materiForm.addEventListener('submit', async function(e) {
            e.preventDefault();
        
            const loadingDiv = document.getElementById('loadingMessage');
            loadingDiv.style.display = 'block';

            const formData = new FormData(materiForm);
            const materiData = Object.fromEntries(formData.entries());

            let fileUrl = currentFileUrl;
            let thumbnailUrl = currentThumbnailUrl;

            const file = document.getElementById('fileInput').files[0];
            const thumbnailFile = document.getElementById('thumbnailInput').files[0];

            if (file) {
                if (currentFileUrl) {
                     const baseMateriUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co/storage/v1/object/public/materi/';
                     await supabase.storage.from('materi').remove([currentFileUrl.replace(baseMateriUrl, '')]);
                }

                const rawName = file.name.replaceAll(/[^\w.\-]/g, '_');
                const fileName = `materi/${Date.now()}_${rawName}`;
                
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('materi')
                    .upload(fileName, file, { upsert: true });
                
                if (uploadError) {
                    alert('Gagal upload file materi: ' + uploadError.message);
                    loadingDiv.style.display = 'none';
                    return;
                }
                
                const { data: publicData } = supabase.storage.from('materi').getPublicUrl(fileName);
                fileUrl = publicData.publicUrl;
            }

            if (thumbnailFile) {
                if (currentThumbnailUrl) {
                    const baseGambarUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co/storage/v1/object/public/gambar/';
                    await supabase.storage.from('gambar').remove([currentThumbnailUrl.replace(baseGambarUrl, '')]);
                }
                
                const rawName = thumbnailFile.name.replaceAll(/[^\w.\-]/g, '_');
                const thumbnailFileName = `materi_thumbnails/${Date.now()}_${rawName}`;
                
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('gambar')
                    .upload(thumbnailFileName, thumbnailFile, { upsert: true });

                if (uploadError) {
                    alert('Gagal upload thumbnail: ' + uploadError.message);
                    loadingDiv.style.display = 'none';
                    return;
                }

                const { data: publicData } = supabase.storage.from('gambar').getPublicUrl(thumbnailFileName);
                thumbnailUrl = publicData.publicUrl;
            }

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert('Silakan login kembali.');
                window.location.href = 'login.html';
                return;
            }

            let error;
            if (editingMateriId) {
                const res = await supabase.from('materi').update({
                    judul: materiData.judul,
                    deskripsi: materiData.deskripsi,
                    file_url: fileUrl,
                    thumbnail_url: thumbnailUrl
                }).eq('id_materi', editingMateriId);

                error = res.error;
                if (!error) {
                    editingMateriId = null;
                    currentFileUrl = null;
                    currentThumbnailUrl = null;
                }
            } else {
                const res = await supabase.from('materi').insert([
                    {
                        judul: materiData.judul,
                        deskripsi: materiData.deskripsi,
                        file_url: fileUrl,
                        thumbnail_url: thumbnailUrl,
                        created_by: user.id
                    }
                ]);
                error = res.error;
            }

            loadingDiv.style.display = 'none';
            if (error) {
                alert('Gagal menyimpan materi: ' + error.message);
                return;
            }

            alert('Materi berhasil disimpan!');
            modal.style.display = "none";
            await loadAllMateri();
            materiForm.reset();
        });
    </script>
</head>
<body>

    <header class="header">
        <section class="flex">
            <a href="admin.html" class="logo">EduWeb</a>
            <div class="icons">
                <div id="menu-btn" class="fas fa-bars"></div>
                <div id="user-btn" class="fas fa-user"></div>
                <div id="toggle-btn" class="fas fa-sun"></div>
            </div>
            <div class="profile">
                <p class="role">Halo</p>
                <h3 class="name" id="userName"></h3>
                <p><span id="role"></span></p>
                <a id="logoutBtn" class="delete-btn">Keluar</a>
            </div>
        </section>
    </header>
    
    <div class="side-bar">
        <div id="close-btn">
            <i class="fas fa-times"></i>
        </div>
        <div class="profile">
            <img src="images/pic-1.jpg" class="image" alt="">
            <h3 class="role">Eduweb</h3>
            <h2 class="name">Daftar Menu</h2>
        </div>
        <nav class="navbar">
            <a href="admin.html"><i class="fas fa-home"></i><span>Beranda</span></a>
            <a href="admin-courses.html"><i class="fas fa-book"></i><span>Data Materi</span></a>
            <a href="admin-playlist.html"><i class="fas fa-play-circle"></i><span>Data Video</span></a>
            <a href="admin-courses2.html"><i class="fas fa-edit"></i><span>Data Tugas</span></a>
            <a href="admin-courses3.html"><i class="fas fa-list"></i><span>Data Jawaban</span></a>
            <a href="admin-user.html"><i class="fas fa-user"></i><span>Data Siswa</span></a>
        </nav>
    </div>

    <div>
        <button id="openModalBtn">Tambah +</button>
        <div id="materiModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="materiModalTitle">Tambah Materi</h3>
                <form id="materiForm">
                    <input type="text" name="judul" placeholder="Judul" required>
                    <input type="text" name="deskripsi" placeholder="Deskripsi" required>
                    <div class="form-group">
                        <label for="fileInput">File Materi (PDF):</label>
                        <input type="file" id="fileInput" accept="application/pdf"/>
                    </div>
                    <div class="form-group">
                        <label for="thumbnailInput">File Thumbnail (Gambar):</label>
                        <input type="file" id="thumbnailInput" accept="image/*"/>
                    </div>
                    <button type="submit">Simpan</button>
                </form>
                <div id="loadingMessage" style="display: none; color: blue; font-weight: bold; font-size: 16px;">
                    Materi sedang diunggah...
                </div>
            </div>
        </div>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Judul</th>
                <th>Deskripsi</th>
                <th>File Path</th>
                <th>Thumbnail</th>
                <th>Dibuat oleh</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="materiTableBody">
            </tbody>
    </table>

    <script src="js/script.js" type="module"></script>

</body>
</html>
