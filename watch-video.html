<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lihat Video</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3YWh3ZXJoeGtxcG5oeGxsYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcxODQ4OTUsImV4cCI6MjA2Mjc2MDg5NX0.8-HqAo5AEK5nPU86mTAme8SQv-egMYPDy39wJ-3bEwg'
        const supabase = createClient(supabaseUrl, supabaseKey)
        
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession()

            if (session) {
                console.log('Login OK:', session.user.email)
                await updateUserName();
                await loadVideo();
            } else {
                window.location.href = 'login.html'
            }
        });

        async function updateUserName() {
            const userNameElement = document.getElementById('userName');
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { data, error } = await supabase.from('user').select('nama').eq('user_id', user.id).single();
                if (data) {
                    userNameElement.innerText = data.nama;
                } else {
                    console.error('Gagal mengambil nama pengguna:', error);
                }
            } else {
                userNameElement.innerText = 'Pengguna';
            }
        }

        const logoutBtn = document.getElementById('logoutBtn')
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                const { error } = await supabase.auth.signOut()
                if (error) {
                    alert('Gagal logout: ' + error.message)
                    return
                }
                localStorage.clear()
                window.location.href = 'login.html'
            })
        }

        function getVideoParamsFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                id: urlParams.get('id'),
                sumber: urlParams.get('sumber')
            };
        }

        async function loadVideo() {
            const { id, sumber } = getVideoParamsFromUrl();
            if (!id || !sumber) {
                console.error("ID atau sumber video tidak ditemukan di URL.");
                document.getElementById('videoTitle').innerText = "Video tidak ditemukan.";
                document.getElementById('videoDescription').innerText = "ID video tidak valid. Silakan kembali ke halaman sebelumnya.";
                return;
            }
            
            let query = supabase.from('video').select('*');

            if (sumber === 'youtube') {
                query = query.eq('file_url', id);
            } else {
                query = query.eq('id_video', id);
            }

            const { data: video, error } = await query.single();

            if (error || !video) {
                console.error("Gagal mengambil data video:", error);
                document.getElementById('videoTitle').innerText = "Video tidak ditemukan.";
                document.getElementById('videoDescription').innerText = "Data video tidak ada atau tidak dapat diakses.";
                return;
            }
            
            const videoContainer = document.getElementById('videoContainer');
            
            // Hapus konten yang sudah ada sebelum mengisi yang baru
            const existingVideoPlayer = videoContainer.querySelector('.video-player');
            if (existingVideoPlayer) {
                existingVideoPlayer.remove();
            }
            
            const videoPlayerDiv = document.createElement('div');
            videoPlayerDiv.classList.add('video-player');
            
            if (video.sumber === 'YouTube') {
                const videoId = video.file_url;
                if (videoId) {
                    const youtubeEmbedUrl = `https://www.youtube.com/embed/${videoId}`;
                    videoPlayerDiv.innerHTML = `<iframe width="100%" height="500px" src="${youtubeEmbedUrl}" title="${video.judul}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                } else {
                    videoPlayerDiv.innerHTML = `<p style="text-align:center; color:red;">Gagal memuat video YouTube. ID video tidak ditemukan.</p>`;
                }
            } else {
                const thumbnailUrl = video.thumbnail_url || '';
                videoPlayerDiv.innerHTML = `<video src="${video.file_url}" controls poster="${thumbnailUrl}" style="width:100%; height:auto;" id="video"></video>`;
            }

            videoContainer.prepend(videoPlayerDiv);

            document.getElementById('videoTitle').innerText = video.judul;
            document.getElementById('videoDescription').innerText = video.deskripsi;
        }

    </script>
</head>
<body>
    <header class="header">
        <section class="flex">
            <a href="home.html" class="logo">EduWeb</a>
            <div class="icons">
                <div id="menu-btn" class="fas fa-bars"></div>
                <div id="user-btn" class="fas fa-user"></div>
                <div id="toggle-btn" class="fas fa-sun"></div>
            </div>
            <div class="profile">
                <p class="role">Halo</p>
                <h3 class="name" id="userName"></h3>
                <p><span id="role"></span></p>
                <a id="logoutBtn" class="delete-btn">Keluar</a>
            </div>
        </section>
    </header>
    
    <div class="side-bar">
        <div id="close-btn">
            <i class="fas fa-times"></i>
        </div>
        <div class="profile">
            <img src="images/pic-1.jpg" class="image" alt="">
            <h3 class="role">Eduweb</h3>
            <h2 class="name">Daftar Menu</h2>
        </div>
        <nav class="navbar">
            <a href="home.html"><i class="fas fa-home"></i><span>Beranda</span></a>
            <a href="courses.html"><i class="fas fa-book"></i><span>Materi</span></a>
            <a href="playlist.html"><i class="fas fa-play-circle"></i><span>Video</span></a>
            <a href="courses2.html"><i class="fas fa-edit"></i><span>Tugas</span></a>
        </nav>
    </div>

    <section class="home-grid">
        <h1 class="heading">Lihat Video</h1>
        <section class="watch-video">
            <div class="video-container" id="videoContainer">
                <h3 class="title" id="videoTitle"></h3>
                <p class="description" id="videoDescription"></p>
            </div>
        </section>
    </section>
    <script src="js/script.js"></script>
</body>
</html>
