<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Jawaban</title>
    <link rel="icon" type="image/x-icon" href="images/pic-1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js';

        const supabaseUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3YWh3ZXJoeGtxcG5oeGxsYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcxODQ4OTUsImV4cCI6MjA2Mjc2MDg5NX0.8-HqAo5AEK5nPU86mTAme8SQv-egMYPDy39wJ-3bEwg';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let selectedJawabanId = null;
        let currentFilteredData = [];

        // Fungsi untuk menutup modal penilaian
        function closeNilaiModal() {
            const modal = document.getElementById('nilaiModal');
            modal.style.display = 'none';
            document.getElementById('nilaiForm').reset();
            selectedJawabanId = null;
        }

        // FUNGSI UTAMA YANG DIREVISI TOTAL
        async function loadAndFilterJawaban(sortBy = 'created_at', sortOrder = 'desc') {
            const tableBody = document.getElementById('jawabanTableBody');
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Memuat data...</td></tr>';

            const selectedKelas = document.getElementById('filterKelas').value;
            const selectedJurusan = document.getElementById('filterJurusan').value;
            const selectedTugas = document.getElementById('filterTugas').value;

            let query = supabase.from('jawaban').select(`
                id_jawaban,
                file_url,
                created_at,
                skor,
                user:created_by(nama, absen, kelas, jurusan),
                tugas:id_tugas(judul, id_tugas)
            `);

            // Tambahkan kondisi filter secara dinamis
            if (selectedKelas) {
                query = query.filter('user.kelas', 'eq', selectedKelas);
            }
            if (selectedJurusan) {
                query = query.filter('user.jurusan', 'eq', selectedJurusan);
            }
            if (selectedTugas) {
                const { data: tugasData, error: tugasError } = await supabase
                    .from('tugas')
                    .select('id_tugas')
                    .eq('judul', selectedTugas)
                    .single();

                if (tugasError || !tugasData) {
                    console.error('Tugas tidak ditemukan atau gagal mengambil ID:', tugasError);
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Tugas tidak ditemukan.</td></tr>';
                    return;
                }
                query = query.eq('id_tugas', tugasData.id_tugas);
            }

            const { data, error } = await query;

            if (error) {
                console.error('Gagal mengambil data:', error);
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Gagal memuat data.</td></tr>';
                return;
            }

            const filteredData = data.filter(jawaban => jawaban.user);

            // Logika Pengurutan di Sisi Klien
            filteredData.sort((a, b) => {
                if (sortBy === 'absen') {
                    const absenA = a.user?.absen || Infinity;
                    const absenB = b.user?.absen || Infinity;
                    return sortOrder === 'asc' ? absenA - absenB : absenB - absenA;
                } else { // Default: 'created_at'
                    const dateA = new Date(a.created_at);
                    const dateB = new Date(b.created_at);
                    return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
                }
            });

            currentFilteredData = filteredData;

            tableBody.innerHTML = '';
            
            if (filteredData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Tidak ada data yang ditemukan.</td></tr>';
                return;
            }

            filteredData.forEach(jawaban => {
                const row = document.createElement('tr');
                const taskTitle = jawaban.tugas?.judul || 'Judul Tidak Ditemukan';
                const studentAbsen = jawaban.user?.absen || '-';
                const studentName = jawaban.user?.nama || 'Nama Tidak Ditemukan';
                const studentInfo = `${jawaban.user?.kelas || ''} - ${jawaban.user?.jurusan || ''}`.trim();
                const score = jawaban.skor !== null ? jawaban.skor : '-';
                const formattedDate = new Date(jawaban.created_at).toLocaleString('id-ID', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                row.innerHTML = `
                    <td data-label="Judul Tugas:">${taskTitle}</td>
                    <td data-label="No. Absen:">${studentAbsen}</td>
                    <td data-label="Nama:">${studentName}</td>
                    <td data-label="Jurusan:">${studentInfo}</td>
                    <td data-label="File:"><a href="${jawaban.file_url}" target="_blank">Lihat File</a></td>
                    <td data-label="Nilai:">${score}</td>
                    <td data-label="Waktu Pengumpulan:">${formattedDate}</td>
                    <td style="text-align: center;">
                        <button class="nilai-btn" data-id="${jawaban.id_jawaban}" data-skor="${jawaban.skor !== null ? jawaban.skor : ''}">Nilai</button>
                    </td>
                    `;
                
                tableBody.appendChild(row);
            });

            document.querySelectorAll('.nilai-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    selectedJawabanId = e.target.dataset.id;
                    const skor = e.target.dataset.skor;
                    document.querySelector('#nilaiForm input[name="skor"]').value = skor;
                    document.getElementById('nilaiModal').style.display = 'block';
                });
            });
        }

        // Fungsi untuk memperbarui nama pengguna di header
        async function updateUserName() {
            const userNameElement = document.getElementById('userName');
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { data, error } = await supabase.from('user').select('nama').eq('user_id', user.id).single();
                if (data) {
                    userNameElement.innerText = data.nama;
                }
            } else {
                userNameElement.innerText = 'Pengguna';
            }
        }

        // Fungsi untuk mengisi dropdown filter
        async function populateFilters() {
            const { data: userData, error: userError } = await supabase
                .from('user')
                .select('kelas, jurusan')
                .order('kelas', { ascending: true })
                .order('jurusan', { ascending: true });

            if (userError) {
                console.error('Gagal mengambil data user:', userError);
                return;
            }

            const kelasSet = new Set(userData.map(item => item.kelas).filter(Boolean));
            const kelasSelect = document.getElementById('filterKelas');
            kelasSet.forEach(kelas => {
                const option = document.createElement('option');
                option.value = kelas;
                option.textContent = kelas;
                kelasSelect.appendChild(option);
            });

            const jurusanSet = new Set(userData.map(item => item.jurusan).filter(Boolean));
            const jurusanSelect = document.getElementById('filterJurusan');
            jurusanSet.forEach(jurusan => {
                const option = document.createElement('option');
                option.value = jurusan;
                option.textContent = jurusan;
                jurusanSelect.appendChild(option);
            });

            const { data: tugasData, error: tugasError } = await supabase
                .from('tugas')
                .select('judul')
                .order('judul', { ascending: true });

            if (tugasError) {
                console.error('Gagal mengambil data tugas:', tugasError);
                return;
            }

            const tugasSelect = document.getElementById('filterTugas');
            tugasData.forEach(tugas => {
                const option = document.createElement('option');
                option.value = tugas.judul;
                option.textContent = tugas.judul;
                tugasSelect.appendChild(option);
            });
        }

        // FUNGSI EKSPOR YANG DIREVISI MENGGUNAKAN DATA DIFILTER
        async function exportToExcelXLSX() {
            if (currentFilteredData.length === 0) {
                alert('Tidak ada data yang difilter untuk diunduh. Silakan filter data terlebih dahulu.');
                return;
            }

            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Data Jawaban Siswa');
            
            const selectedKelas = document.getElementById('filterKelas').value;
            const selectedJurusan = document.getElementById('filterJurusan').value;
            const selectedTugas = document.getElementById('filterTugas').value;
            const reportTitle = `Laporan Nilai Jawaban Siswa - ${selectedKelas || 'Semua Kelas'} / ${selectedJurusan || 'Semua Jurusan'} / ${selectedTugas || 'Semua Tugas'}`;
            
            worksheet.mergeCells('A1:G1');
            worksheet.getCell('A1').value = reportTitle;
            worksheet.getCell('A1').font = { size: 16, bold: true };
            worksheet.getCell('A1').alignment = { horizontal: 'center' };

            const headers = [
                "No. Absen",
                "Nama Siswa",
                "Kelas",
                "Jurusan",
                "Judul Tugas",
                "Nilai",
                "Waktu Pengumpulan"
            ];
            worksheet.addRow([]);
            const headerRow = worksheet.addRow(headers);
            headerRow.font = { bold: true };
            headerRow.alignment = { vertical: 'middle', horizontal: 'center' };

            currentFilteredData.forEach(jawaban => {
                const studentAbsen = jawaban.user?.absen || '';
                const studentName = jawaban.user?.nama || '';
                const studentClass = jawaban.user?.kelas || '';
                const studentMajor = jawaban.user?.jurusan || '';
                const taskTitle = jawaban.tugas?.judul || '';
                const score = jawaban.skor !== null ? jawaban.skor : '-';
                const submissionDate = new Date(jawaban.created_at).toLocaleString('id-ID');

                worksheet.addRow([
                    studentAbsen,
                    studentName,
                    studentClass,
                    studentMajor,
                    taskTitle,
                    score,
                    submissionDate
                ]);
            });
            
            worksheet.columns = [
                { width: 8 },
                { width: 28 },
                { width: 8 },
                { width: 12 },
                { width: 26 },
                { width: 8 },
                { width: 18 }
            ];

            worksheet.getColumn('A').alignment = { horizontal: 'center'};
            worksheet.getColumn('C').alignment = { horizontal: 'center'};
            worksheet.getColumn('D').alignment = { horizontal: 'center'};
            worksheet.getColumn('F').alignment = { horizontal: 'center'};

            worksheet.getCell('A3').alignment = { horizontal: 'center', wrapText: true };
            worksheet.getCell('C3').alignment = { horizontal: 'center', vertical: 'middle'};
            worksheet.getCell('D3').alignment = { horizontal: 'center', vertical: 'middle'};
            worksheet.getCell('F3').alignment = { horizontal: 'center', vertical: 'middle'};
            worksheet.getCell('G3').alignment = { horizontal: 'center', wrapText: true };

            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), 'data_jawaban.xlsx');
        }

        // EVENT LISTENER UTAMA YANG DIREVISI
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                console.log('Login OK:', session.user.email);
                await populateFilters();
                loadAndFilterJawaban('created_at', 'desc'); // Panggil fungsi ini untuk pertama kali dengan sort default
                updateUserName();
            } else {
                supabase.auth.onAuthStateChange((event, session) => {
                    if (!session) {
                        window.location.href = 'login.html';
                    }
                });
            }

            // Tambahkan event listener untuk filter
            document.getElementById('filterKelas').addEventListener('change', () => loadAndFilterJawaban());
            document.getElementById('filterJurusan').addEventListener('change', () => loadAndFilterJawaban());
            document.getElementById('filterTugas').addEventListener('change', () => loadAndFilterJawaban());
            
            // Tambahkan event listener untuk sort
            document.getElementById('sortOrder').addEventListener('change', () => {
                const [sortBy, sortOrder] = document.getElementById('sortOrder').value.split('-');
                loadAndFilterJawaban(sortBy, sortOrder);
            });

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    const { error } = await supabase.auth.signOut();
                    if (error) {
                        alert('Gagal logout: ' + error.message);
                        return;
                    }
                    window.location.href = 'login.html';
                });
            }

            const nilaiForm = document.getElementById('nilaiForm');
            nilaiForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const skorInput = nilaiForm.querySelector('input[name="skor"]');
                const skor = parseInt(skorInput.value);

                if (isNaN(skor) || skor < 0 || skor > 100) {
                    alert('Skor tidak valid. Mohon masukkan nilai antara 0-100.');
                    return;
                }

                const { error } = await supabase
                    .from('jawaban')
                    .update({ skor: skor })
                    .eq('id_jawaban', selectedJawabanId);

                if (error) {
                    alert('Gagal menyimpan nilai: ' + error.message);
                    return;
                }

                alert('Nilai berhasil disimpan!');
                closeNilaiModal();
                loadAndFilterJawaban(); // Muat ulang data yang difilter
            });

            const modal = document.getElementById('nilaiModal');
            const modalCloseBtn = document.querySelector('.close');
            if (modalCloseBtn) {
                modalCloseBtn.onclick = () => {
                    closeNilaiModal();
                };
            }
            window.onclick = function(event) {
                if (event.target == modal) {
                    closeNilaiModal();
                }
            };

            const downloadExcelBtn = document.getElementById('downloadExcelBtn');
            if (downloadExcelBtn) {
                downloadExcelBtn.addEventListener('click', exportToExcelXLSX);
            }
        });
    </script>
</head>

<body>
    <header class="header">
        <section class="flex">
            <a href="admin.html" class="logo">EduWeb</a>
            <div class="icons">
                <div id="menu-btn" class="fas fa-bars"></div>
                <div id="user-btn" class="fas fa-user"></div>
                <div id="toggle-btn" class="fas fa-sun"></div>
            </div>
            <div class="profile">
                <p class="role">Halo</p>
                <h3 class="name" id="userName"></h3>
                <p><span id="role"></span></p>
                <a id="logoutBtn" class="delete-btn">Keluar</a>
            </div>
        </section>
    </header>

    <div class="side-bar">
        <div id="close-btn">
            <i class="fas fa-times"></i>
        </div>
        <div class="profile">
            <img src="images/pic-1.jpg" class="image" alt="">
            <h3 class="role">Eduweb</h3>
            <h2 class="name">Daftar Menu</h2>
        </div>
        <nav class="navbar">
            <a href="admin.html"><i class="fas fa-home"></i><span>Beranda</span></a>
            <a href="admin-courses.html"><i class="fas fa-book"></i><span>Data Materi</span></a>
            <a href="admin-playlist.html"><i class="fas fa-play-circle"></i><span>Data Video</span></a>
            <a href="admin-courses2.html"><i class="fas fa-edit"></i><span>Data Tugas</span></a>
            <a href="admin-courses3.html"><i class="fas fa-list"></i><span>Data Jawaban</span></a>
            <a href="admin-user.html"><i class="fas fa-user"></i><span>Data Siswa</span></a>
        </nav>
    </div>

    <div id="nilaiModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Tambahkan Nilai</h3>
            <form id="nilaiForm">
                <input type="number" name="skor" placeholder="Masukkan Nilai (0-100)" min="0" max="100" required>
                <button type="submit">Simpan</button>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-12 text-left">
            <button id="downloadExcelBtn" class="btn btn-primary">Unduh Excel</button>
        </div>
    </div>

    <div class="filter-controls">
        <label for="filterKelas">Filter Kelas:</label>
        <select id="filterKelas">
            <option value="">Semua Kelas</option>
        </select>
        
        <label for="filterJurusan">Filter Jurusan:</label>
        <select id="filterJurusan">
            <option value="">Semua Jurusan</option>
        </select>
        
        <label for="filterTugas">Filter Tugas:</label>
        <select id="filterTugas">
            <option value="">Semua Tugas</option>
        </select>

        <label for="sortOrder">Urutkan Berdasarkan:</label>
        <select id="sortOrder">
            <option value="absen-asc">No. Absen (Kecil-Besar)</option>
            <option value="absen-desc">No. Absen (Besar-Kecil)</option>
            <option value="created_at-asc">Waktu Pengumpulan (Terawal)</option>
            <option value="created_at-desc" selected>Waktu Pengumpulan (Terakhir)</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Judul Tugas</th>
                <th>No. Absen</th>
                <th>Nama Siswa</th>
                <th>Kelas & Jurusan</th>
                <th>File Jawaban</th>
                <th>Skor</th>
                <th>Waktu Pengumpulan</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="jawabanTableBody">
        </tbody>
    </table>
    
    <script src="js/script.js" type="module"></script>

</body>
</html>
