<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
        const supabaseUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3YWh3ZXJoeGtxcG5oeGxsYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcxODQ4OTUsImV4cCI6MjA2Mjc2MDg5NX0.8-HqAo5AEK5nPU86mTAme8SQv-egMYPDy39wJ-3bEwg';
        const supabase = createClient(supabaseUrl, supabaseKey);

        function formatDate(dateString) {
            const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = String(date.getFullYear()).slice(-2);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // Saat halaman dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                console.log('Login OK:', session.user.email);
                loadAllTugas();
            } else {
                supabase.auth.onAuthStateChange((event, session) => {
                    if (!session) {
                        window.location.href = 'login.html';
                    } else {
                        loadAllTugas();
                    }
                });
            }
        });

        const logoutBtn = document.getElementById('logoutBtn');
        logoutBtn.addEventListener('click', async () => {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert('Gagal logout: ' + error.message);
                return;
            }
            localStorage.clear();
            window.location.href = 'login.html';
        });
        
        document.getElementById('userName').innerText = localStorage.getItem('nama') || 'Pengguna';

        let selectedTugasId = null;

        async function loadAllTugas() {
          const { data, error } = await supabase
              .from('tugas')
              .select('id_tugas, judul, deskripsi, file_url, created_at, user:created_by(nama)')
              .order('created_at', { ascending: false });
      
          if (error) {
              console.error('Gagal mengambil data:', error);
              return;
          }
      
          const tableBody = document.getElementById('tugasTableBody');
          tableBody.innerHTML = '';
      
          data.forEach(tugas => {
              const row = document.createElement('tr');
              row.innerHTML = `
                  <td data-label="Judul">${tugas.judul}</td>
                  <td data-label="Deskripsi">${tugas.deskripsi}</td>
                  <td data-label="File Tugas"><a href="${tugas.file_url}" target="_blank">Lihat File</a></td>
                  <td data-label="Dibuat Pada">${formatDate(tugas.created_at)}</td>
                  <td data-label="Dibuat oleh">${tugas.user?.nama || 'Tidak diketahui'}</td>
                  <td data-label="Aksi"><button onclick="openJawabModal('${tugas.id_tugas}')">Jawab</button></td>
              `;
              tableBody.appendChild(row);
          });
      }

        window.openJawabModal = function(id_tugas) {
            selectedTugasId = id_tugas;
            document.getElementById('jawabanModal').style.display = 'block';
        }

        window.closeModal = function() {
            document.getElementById('jawabanModal').style.display = 'none';
            document.getElementById('jawabanForm').reset();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAllTugas();

            const form = document.getElementById('jawabanForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fileInput = document.getElementById('jawabanFile');
                const file = fileInput.files[0];

                if (!file) {
                    alert("Silakan pilih file PDF terlebih dahulu.");
                    return;
                }

                const namaFile = `${Date.now()}_${file.name.replace(/[^\w.-]/g, '_')}`;
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('jawaban')
                    .upload(namaFile, file, { upsert: true });

                if (uploadError) {
                    alert('Gagal upload file: ' + uploadError.message);
                    return;
                }

                const { data: publicData } = supabase.storage.from('jawaban').getPublicUrl(namaFile);
                const fileUrl = publicData.publicUrl;

                const user = await supabase.auth.getUser();
                const userId = user.data.user?.id;
                const { error: insertError } = await supabase.from('jawaban').insert([{
                    id_tugas: selectedTugasId,
                    file_url: fileUrl,
                    created_by: userId
                }]);

                if (insertError) {
                    alert('Gagal menyimpan jawaban: ' + insertError.message);
                    return;
                }

                alert('Jawaban berhasil dikirim!');
                closeModal();
            });
        });
    </script>
</head>

<body>
    <header class="header">
        <section class="flex">
            <a href="home.html" class="logo">EduWeb</a>
            <div class="icons">
                <div id="menu-btn" class="fas fa-bars"></div>
                <div id="user-btn" class="fas fa-user"></div>
                <div id="toggle-btn" class="fas fa-sun"></div>
            </div>
            <div class="profile">
                <p class="role">Halo</p>
                <h3 class="name" id="userName"></h3>
                <a id="logoutBtn" class="delete-btn">Keluar</a>
            </div>
        </section>
    </header>
    
    <div class="side-bar">
        <div id="close-btn">
            <i class="fas fa-times"></i>
        </div>
        <div class="profile">
            <img src="images/pic-1.jpg" class="image" alt="">
            <h3 class="role">Eduweb</h3>
            <h2 class="name">Daftar Menu</h2>
        </div>
        <nav class="navbar">
            <a href="home.html"><i class="fas fa-home"></i><span>Beranda</span></a>
            <a href="courses.html"><i class="fas fa-book"></i><span>Materi</span></a>
            <a href="playlist.html"><i class="fas fa-play-circle"></i><span>Video</span></a>
            <a href="courses2.html"><i class="fas fa-edit"></i><span>Tugas</span></a>
        </nav>
    </div>
    
    <section class="tugas-section">
        <h1 class="heading">Daftar Tugas</h1>

        <div id="jawabanModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()" style="cursor:pointer;float:right;">&times;</span>
                <h3>Unggah Jawaban</h3>
                <form id="jawabanForm">
                    <input type="file" id="jawabanFile" accept="application/pdf" required />
                    <button type="submit">Kirim</button>
                </form>
            </div>
        </div>

        <table class="tugas-table">
            <thead>
                <tr>
                    <th>Judul</th>
                    <th>Deskripsi</th>
                    <th>File Tugas</th>
                    <th>Dibuat Pada</th>
                    <th>Dibuat oleh</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tugasTableBody">
                </tbody>
        </table>
    </section>

    <script src="js/script.js"></script>
    <script>
        // Kode JavaScript untuk sidebar, dsb. bisa ditaruh di sini atau di js/script.js
        const body = document.querySelector('body');
        const darkModeToggle = document.getElementById('toggle-btn');
        const sidebar = document.querySelector('.side-bar');
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');

        darkModeToggle.onclick = () => {
            darkModeToggle.classList.toggle('fa-sun');
            body.classList.toggle('dark');
        };

        menuBtn.onclick = () => {
            sidebar.classList.add('active');
        };

        closeBtn.onclick = () => {
            sidebar.classList.remove('active');
        };
    </script>
</body>
</html>
