<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Video</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'

        const supabaseUrl = 'https://kwahwerhxkqpnhxllavm.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3YWh3ZXJoeGtxcG5oeGxsYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcxODQ4OTUsImV4cCI6MjA2Mjc2MDg5NX0.8-HqAo5AEK5nPU86mTAme8SQv-egMYPDy39wJ-3bEwg'
        const supabase = createClient(supabaseUrl, supabaseKey)

        let editingVideoId = null;
        let currentFileUrl = null;
        let currentThumbnailUrl = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession()
            if (session) {
                console.log('Login OK:', session.user.email)
                document.getElementById('userName').innerText = localStorage.getItem('nama') || 'Pengguna'
                loadAllVideo()
            } else {
                window.location.href = 'login.html'
            }
        })

        const logoutBtn = document.getElementById('logoutBtn')
        logoutBtn.addEventListener('click', async () => {
            const { error } = await supabase.auth.signOut()
            if (error) {
                alert('Gagal logout: ' + error.message)
                return
            }
            localStorage.clear()
            window.location.href = 'login.html'
        })

        async function loadAllVideo() {
            const { data, error } = await supabase
                .from('video')
                .select(`
                    id_video,
                    judul,
                    deskripsi,
                    file_url,
                    thumbnail_url,
                    sumber,
                    created_at,
                    created_by,
                    user:created_by (nama)
                `);

            if (error) {
                console.error('Gagal mengambil data:', error);
                return;
            }

            const tableBody = document.getElementById('videoTableBody');
            tableBody.innerHTML = '';

            data.forEach(video => {
                const row = document.createElement('tr');
                const isYouTube = video.sumber && video.sumber.includes('YouTube');
                const fileLinkText = isYouTube ? 'Tonton di YouTube' : 'Lihat File';
                const fileLink = isYouTube ? `https://www.youtube.com/watch?v=${video.file_url}` : video.file_url;
                const thumbnailUrl = video.thumbnail_url || 'https://via.placeholder.com/50';

                row.innerHTML = `
                    <td>${video.judul}</td>
                    <td>${video.deskripsi}</td>
                    <td><img src="${thumbnailUrl}" alt="Thumbnail" style="width: 50px; height: auto;"></td>
                    <td><a href="${fileLink}" target="_blank">${fileLinkText}</a></td>
                    <td>${video.user?.nama || 'Tidak diketahui'}</td>
                    <td>
                        <button onclick="editVideo('${video.id_video}', '${video.created_by}')">Edit</button>
                        <button onclick="deleteVideo('${video.id_video}', '${video.created_by}')">Hapus</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }   

        loadAllVideo();

        window.deleteVideo = async function(id, creatorId) {
            const { data: { user } } = await supabase.auth.getUser();
            if (user.id !== creatorId) {
                alert("Anda tidak dapat menghapus Video Guru lainnya.");
                return;
            }

            if (!confirm('Apakah Anda yakin ingin menghapus video ini?')) {
                return;
            }
            
            const { data: video, error: fetchError } = await supabase
                .from('video')
                .select('file_url, sumber, thumbnail_url')
                .eq('id_video', id)
                .single();

            if (fetchError) {
                alert('Gagal mengambil data video: ' + fetchError.message);
                return;
            }

            const baseVideoUrl = supabaseUrl + '/storage/v1/object/public/video/';
            const baseThumbnailUrl = supabaseUrl + '/storage/v1/object/public/gambar/';
            const isYouTube = video.sumber && video.sumber.includes('YouTube');

            if (!isYouTube && video.file_url) {
                const relativePath = video.file_url.replace(baseVideoUrl, '');
                const { error: deleteFileError } = await supabase.storage
                    .from('video')
                    .remove([relativePath]);
                if (deleteFileError) {
                    console.error('Gagal menghapus file dari storage:', deleteFileError);
                }
            }

            if (video.thumbnail_url) {
                const relativePath = video.thumbnail_url.replace(baseThumbnailUrl, '');
                const { error: deleteThumbnailError } = await supabase.storage
                    .from('gambar')
                    .remove([relativePath]);
                if (deleteThumbnailError) {
                    console.error('Gagal menghapus thumbnail dari storage:', deleteThumbnailError);
                }
            }

            const { error: deleteVideoError } = await supabase
                .from('video')
                .delete()
                .eq('id_video', id);

            if (deleteVideoError) {
                alert('Gagal menghapus data video: ' + deleteVideoError.message);
                return;
            }

            alert('Video berhasil dihapus!');
            await loadAllVideo();
        };
        
        const fileInputLabel = document.getElementById('fileInputLabel');
        const fileInput = document.getElementById('fileInput');
        const atauText = document.getElementById('atauText');
        const youtubeUrlInputLabel = document.getElementById('youtubeUrlInputLabel');
        const youtubeUrlInput = document.getElementById('youtubeUrlInput');
        const modal = document.getElementById("videoModal");
        const btn = document.getElementById("openModalBtn");
        const span = document.querySelector(".close");
        const videoForm = document.getElementById('videoForm');
        const thumbnailInputLabel = document.getElementById('thumbnailInputLabel');
        const thumbnailInput = document.getElementById('thumbnailInput');
        const currentThumbnailDiv = document.getElementById('currentThumbnailDiv');
        const currentThumbnailImg = document.getElementById('currentThumbnailImg');

        window.editVideo = async function (id, creatorId) {
            const { data: { user } } = await supabase.auth.getUser();
            if (user.id !== creatorId) {
                alert("Anda tidak dapat mengedit Video Guru lainnya.");
                return;
            }
            
            const { data, error } = await supabase
                .from('video')
                .select('*')
                .eq('id_video', id)
                .single();

            if (error) {
                alert('Gagal mengambil data video: ' + error.message);
                return;
            }

            document.querySelector('#videoForm [name="judul"]').value = data.judul;
            document.querySelector('#videoForm [name="deskripsi"]').value = data.deskripsi;

            currentFileUrl = data.file_url;
            currentThumbnailUrl = data.thumbnail_url;
            editingVideoId = id;

            document.getElementById("videoModalTitle").innerText = "Edit Video";
            modal.style.display = "block";

            if (currentThumbnailUrl) {
                currentThumbnailImg.src = currentThumbnailUrl;
                currentThumbnailDiv.style.display = 'block';
            } else {
                currentThumbnailDiv.style.display = 'none';
            }

            const isYouTube = data.sumber && data.sumber.includes('YouTube');

            if (isYouTube) {
                fileInputLabel.style.display = 'none';
                fileInput.style.display = 'none';
                atauText.style.display = 'none';
                youtubeUrlInputLabel.style.display = 'block';
                youtubeUrlInput.style.display = 'block';
                youtubeUrlInput.value = `https://www.youtube.com/watch?v=${data.file_url}`;
            } else {
                fileInputLabel.style.display = 'block';
                fileInput.style.display = 'block';
                atauText.style.display = 'none';
                youtubeUrlInputLabel.style.display = 'none';
                youtubeUrlInput.style.display = 'none';
                youtubeUrlInput.value = '';
            }

            fileInput.required = false;
            youtubeUrlInput.required = false;
            thumbnailInput.required = false;
        };


        btn.onclick = function() {
            modal.style.display = "block";
            document.getElementById("videoModalTitle").innerText = "Tambah Video";
            editingVideoId = null;
            currentFileUrl = null;
            currentThumbnailUrl = null;
            videoForm.reset();
            currentThumbnailDiv.style.display = 'none';

            fileInputLabel.style.display = 'block';
            fileInput.style.display = 'block';
            atauText.style.display = 'block';
            youtubeUrlInputLabel.style.display = 'block';
            youtubeUrlInput.style.display = 'block';
            thumbnailInputLabel.style.display = 'block';
            thumbnailInput.style.display = 'block';
            
            fileInput.required = false;
            youtubeUrlInput.required = false;
            thumbnailInput.required = false;
        };
        
        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };
        
        videoForm.addEventListener('submit', async function(e) {
            e.preventDefault();
        
            const loadingDiv = document.getElementById('loadingMessage');
            loadingDiv.style.display = 'block';
        
            const formData = new FormData(videoForm);
            const judul = formData.get('judul');
            const deskripsi = formData.get('deskripsi');
            const file = document.getElementById('fileInput').files[0];
            const youtubeUrl = document.getElementById('youtubeUrlInput').value.trim();
            const thumbnailFile = document.getElementById('thumbnailInput').files[0];
            
            if (!file && !youtubeUrl && !editingVideoId) {
                alert('Anda harus mengunggah file atau memasukkan URL YouTube.');
                loadingDiv.style.display = 'none';
                return;
            }
        
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert('Silakan login kembali.');
                window.location.href = 'login.html';
                return;
            }
            const createdBy = session.user.id;
            let fileUrl = currentFileUrl;
            let sumber = '';
            let thumbnailUrl = currentThumbnailUrl;
        
            try {
                if (thumbnailFile) {
                    if (editingVideoId && currentThumbnailUrl) {
                        const baseThumbnailUrl = supabaseUrl + '/storage/v1/object/public/gambar/';
                        const relativePath = currentThumbnailUrl.replace(baseThumbnailUrl, '').replace(/^\/+/, '').replace(/\/{2,}/g, '/');
                        const { error: removeError } = await supabase.storage.from('gambar').remove([relativePath]);
                        if (removeError) console.error('Gagal menghapus thumbnail lama:', removeError.message);
                    }
                    const rawName = thumbnailFile.name.replaceAll(/[^\w.\-]/g, '_');
                    const thumbnailName = `video_thumbnails/${Date.now()}_${rawName}`;
                    const { error: uploadError } = await supabase
                        .storage
                        .from('gambar')
                        .upload(thumbnailName, thumbnailFile, { upsert: true });
        
                    if (uploadError) throw uploadError;
                    
                    const { data: publicData } = supabase.storage
                        .from('gambar')
                        .getPublicUrl(thumbnailName);
                    thumbnailUrl = publicData.publicUrl;
                }
        
                if (file) {
                    if (editingVideoId && currentFileUrl && currentFileUrl.startsWith(supabaseUrl)) {
                        const basePublicUrl = supabaseUrl + '/storage/v1/object/public/video/';
                        const relativePath = currentFileUrl.replace(basePublicUrl, '').replace(/^\/+/, '').replace(/\/{2,}/g, '/');
                        const { error: removeError } = await supabase.storage.from('video').remove([relativePath]);
                        if (removeError) console.error('Gagal menghapus file lama:', removeError.message);
                    }
                    const rawName = file.name.replaceAll(/[^\w.\-]/g, '_');
                    const fileName = `${Date.now()}_${rawName}`;
                    const { error: uploadError } = await supabase
                        .storage
                        .from('video')
                        .upload(fileName, file, { upsert: true });
        
                    if (uploadError) throw uploadError;
        
                    const { data: publicData } = supabase.storage
                        .from('video')
                        .getPublicUrl(fileName);
                    fileUrl = publicData.publicUrl;
                    sumber = 'Internal';
                } else if (youtubeUrl) {
                    let videoId = '';
                    try {
                        const url = new URL(youtubeUrl);
                        if (url.hostname === 'www.youtube.com' || url.hostname === 'youtube.com') {
                            videoId = url.searchParams.get('v');
                        } else if (url.hostname === 'youtu.be') {
                            videoId = url.pathname.substring(1).split('?')[0];
                        }
                    } catch (e) {
                        console.error("URL YouTube tidak valid", e);
                    }
        
                    if (videoId) {
                        fileUrl = videoId;
                        sumber = 'YouTube';
                    } else {
                        throw new Error('URL YouTube tidak valid.');
                    }
                }
        
                let res;
                if (editingVideoId) {
                    res = await supabase
                        .from('video')
                        .update({ judul, deskripsi, file_url: fileUrl, sumber, thumbnail_url: thumbnailUrl })
                        .eq('id_video', editingVideoId);
                } else {
                    res = await supabase
                        .from('video')
                        .insert([{ judul, deskripsi, file_url: fileUrl, sumber, created_by: createdBy, thumbnail_url: thumbnailUrl }]);
                }
        
                if (res.error) throw res.error;
        
                alert('Video berhasil disimpan!');
                modal.style.display = "none";
                await loadAllVideo();
                videoForm.reset();
                document.getElementById('fileInput').value = '';
                document.getElementById('youtubeUrlInput').value = '';
                document.getElementById('thumbnailInput').value = '';
            
            } catch (error) {
                console.error('Gagal menyimpan video:', error);
                alert('Gagal menyimpan video. Silakan coba lagi. Detail: ' + error.message);
            } finally {
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</head>
<body>

    <header class="header">
        <section class="flex">
            <a href="admin.html" class="logo">EduWeb</a>
            <div class="icons">
                <div id="menu-btn" class="fas fa-bars"></div>
                <div id="user-btn" class="fas fa-user"></div>
                <div id="toggle-btn" class="fas fa-sun"></div>
            </div>
            <div class="profile">
                <p class="role">Halo</p>
                <h3 class="name" id="userName"></h3>
                <p><span id="role"></span></p>
                <a id="logoutBtn" class="delete-btn">Keluar</a>
            </div>
        </section>
    </header>
    
    <div class="side-bar">
        <div id="close-btn">
            <i class="fas fa-times"></i>
        </div>
        <div class="profile">
            <img src="images/pic-1.jpg" class="image" alt="">
            <h3 class="role">Eduweb</h3>
            <h2 class="name">Daftar Menu</h2>
        </div>
        <nav class="navbar">
            <a href="admin.html"><i class="fas fa-home"></i><span>Beranda</span></a>
            <a href="admin-courses.html"><i class="fas fa-book"></i><span>Data Materi</span></a>
            <a href="admin-playlist.html"><i class="fas fa-play-circle"></i><span>Data Video</span></a>
            <a href="admin-courses2.html"><i class="fas fa-edit"></i><span>Data Tugas</span></a>
            <a href="admin-courses3.html"><i class="fas fa-list"></i><span>Data Jawaban</span></a>
            <a href="admin-user.html"><i class="fas fa-user"></i><span>Data Siswa</span></a>
        </nav>
    </div> 

    <div>
        <button id="openModalBtn" class="inline-btn">Tambah +</button>
        <div id="videoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="videoModalTitle">Tambah Video</h3>
                <form id="videoForm">
                    <input type="text" name="judul" placeholder="Judul" required>
                    <input type="text" name="deskripsi" placeholder="Deskripsi" required>
                    
                    <div id="currentThumbnailDiv" class="form-group" style="display: none;">
                        <label>Thumbnail saat ini:</label>
                        <img id="currentThumbnailImg" src="" alt="Thumbnail Video" style="width: 100px; height: auto; margin-top: 10px;">
                    </div>

                    <div class="form-group">
                        <label id="thumbnailInputLabel" for="thumbnailInput">Unggah Thumbnail:</label>
                        <input type="file" id="thumbnailInput" accept="image/*"/>
                    </div>
                    <div class="form-group">
                        <label id="fileInputLabel" for="fileInput">Unggah Video:</label>
                        <input type="file" id="fileInput" accept="video/*" />
                    </div>
                    <div id="atauText" class="form-group">
                        <p style="text-align: center; font-style: italic; font-size: 15px;">ATAU</p>
                    </div>
                    <div class="form-group">
                        <label id="youtubeUrlInputLabel" for="youtubeUrlInput">Link YouTube:</label>
                        <input type="url" id="youtubeUrlInput" placeholder="https://www.youtube.com/watch?v=..." />
                    </div>
                    <button type="submit" class="inline-btn">Simpan</button>
                </form>
                <div id="loadingMessage" style="display: none; color: blue; font-weight: bold; font-size: 16px;">
                    Video sedang diunggah...
                </div>
            </div>
        </div>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Judul</th>
                <th>Deskripsi</th>
                <th>Thumbnail</th>
                <th>File/Link</th>
                <th>Dibuat oleh</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="videoTableBody">
        </tbody>
    </table>

    <script src="js/script.js"></script>

</body>
</html>
